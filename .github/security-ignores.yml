# Vulnerabilities that may wait, each with a reason and a deadline.
#
# An entry needs all three fields. CI fails when an entry is expired, has no
# reason, or has no expires date — so a suppression cannot quietly become
# permanent. Renewing one means a new pull request with a fresh reason.
ignores:
    - id: GHSA-86w9-cpqp-85rv
      reason: >-
          node-forge RSA PKCS#1 v1.5 signature verification issue. No patched
          release exists upstream (latest published version is 1.4.0, the
          vulnerable one); patched_versions is null in the advisory. Pulled in
          transitively under expo/@expo/cli tooling, not used by our own code.
          Nothing short of an upstream fix unblocks this.
      expires: 2027-01-15
    - id: GHSA-vfj7-8cjw-p6xm
      reason: >-
          braces stack-exhaustion DoS. No patched release exists upstream
          (latest published version is 3.0.3, the vulnerable one);
          patched_versions is null in the advisory. Pulled in transitively
          under expo/metro build tooling. Nothing short of an upstream fix
          unblocks this.
      expires: 2027-01-15
# ignores:
#     - id: GHSA-xxxx-xxxx-xxxx
#       reason: Reachable only from the CLI --debug path, which the server excludes.
#       expires: 2026-01-15

# Forked dependencies, which no vulnerability scanner can see. Each needs a
# date on which somebody last compared the fork to upstream, and a window in
# days. CI fails when a window lapses, or when a new fork appears with no
# entry at all.
forkReviews:
    - fork: github.com/pocketbase/pocketbase
      reviewed: 2026-10-06
      days: 30
    - fork: github.com/osshield/gopbs
      reviewed: 2026-10-06
      days: 90
    - fork: github.com/emersion/go-webdav
      reviewed: 2026-10-06
      days: 90
    - fork: react-native-drax
      reviewed: 2026-10-06
      days: 90
